version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: Clearway_Cyber_db
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: Clearway_Cyber_db
      PEPPER: 'change-me'
      JWT_SECRET: 'change-me'
    depends_on:
      - db
    volumes:
      - .:/app:delegated

volumes:
  db_data:
