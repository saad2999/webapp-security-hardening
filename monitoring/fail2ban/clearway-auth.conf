# Fail2Ban filter for Clearway app compact logs
[Definition]

# Match compact FAILED_LOGIN and ACCOUNT_LOCK lines produced by the app
# Examples produced by the app:
# 2025-12-14T12:00:00 [warn] FAILED_LOGIN email=foo@example.com ip=1.2.3.4 reason=badpassword
# 2025-12-14T12:01:00 [warn] FAILED_LOGIN email=foo@example.com ip=1.2.3.4 reason=nosuchuser
# 2025-12-14T12:02:00 [warn] ACCOUNT_LOCK email=foo@example.com ip=1.2.3.4

failregex = .*FAILED_LOGIN .* ip=(?P<host>\d{1,3}(?:\.\d{1,3}){3}).*
            .*ACCOUNT_LOCK .* ip=(?P<host>\d{1,3}(?:\.\d{1,3}){3}).*

ignoreregex =
