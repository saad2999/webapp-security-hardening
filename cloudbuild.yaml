steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA', '.']

  # Step 2: Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy webapp \
          --image gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --service-account webapp-deployer@$PROJECT_ID.iam.gserviceaccount.com \
          --add-cloudsql-instances=${_CLOUDSQL_INSTANCE} \
          --set-env-vars "NODE_ENV=production,INSTANCE_CONNECTION_NAME=${_CLOUDSQL_INSTANCE},DB_NAME=Clearway_Cyber_db,DB_USER=root"

substitutions:
  _REGION: "us-central1"
  _CLOUDSQL_INSTANCE: "project-dd3fa7a3-d0dc-4556-8d3:us-central1:clearway-sql"

images:
  - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'