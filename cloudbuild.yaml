steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy webapp \
          --image gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA \
          --region ${_REGION:-us-central1} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production" \
          ${_CLOUDSQL_INSTANCE:+--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}} \
          
substitutions:
  _REGION: "us-central1"
  _CLOUDSQL_INSTANCE: ""

images:
  - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
