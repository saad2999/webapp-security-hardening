steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA', '.']

  # Step 2: Push the image to Artifact Registry (gcr.io)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run with explicit runtime service account
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy webapp \
          --image gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA \
          --region ${_REGION:-us-central1} \
          --platform managed \
          --allow-unauthenticated \
          --service-account webapp-deployer@project-dd3fa7a3-d0dc-4556-8d3.iam.gserviceaccount.com \
          --set-env-vars "NODE_ENV=production" \
          ${_CLOUDSQL_INSTANCE:+--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}}

substitutions:
  _REGION: "us-central1"
  _CLOUDSQL_INSTANCE: ""

images:
  - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY