# Step 3: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy webapp \
        --image gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA \
        --region ${_REGION:-us-central1} \
        --platform managed \
        --allow-unauthenticated \
        --service-account webapp-deployer@$PROJECT_ID.iam.gserviceaccount.com \
        --set-env-vars "NODE_ENV=production" \
        --timeout=300s \
        ${_CLOUDSQL_INSTANCE:+--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}}