steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA', '.']

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy webapp \
          --image gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --service-account webapp-deployer@$PROJECT_ID.iam.gserviceaccount.com \
          --set-env-vars "NODE_ENV=production" \
          --timeout=300s \
          --add-cloudsql-instances=$PROJECT_ID:us-central1:clearway-sql

# Substitution variables (optional - values are hardcoded above for simplicity)
substitutions:
  _REGION: "us-central1"

# Images to store
images:
  - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'

# Overall build timeout (20 minutes)
timeout: 1200s

# Logging options
options:
  logging: CLOUD_LOGGING_ONLY